name: Build Forge Mod

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 🔥 关键修改：使用 GitHub 官方 Gradle Action，从 GitHub 缓存下载，不依赖外网
      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 编译模组
        run: ./gradlew build --no-daemon

      - name: 上传 JAR 文件
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar