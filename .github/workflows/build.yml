name: Build Forge Mod

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # ========== 核心修改 ==========
      # 使用 GitHub 官方 Gradle Action，自动从 GitHub 缓存下载 Gradle
      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      # ===============================

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 编译模组
        # 加上 --no-daemon --refresh-dependencies 强制重新下载依赖
        run: ./gradlew build --no-daemon

      - name: 上传 JAR 文件
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar