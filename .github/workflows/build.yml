name: Build Forge Mod

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 编译模组
        run: ./gradlew build --no-daemon

      - name: 上传 JAR 文件
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar